<rect x="205" y="168" width="80" height="26" rx="13" fill="#06b6d4" fill-opacity="0.14" stroke="#06b6d4" stroke-opacity="0.55"/><text x="245.0" y="185.2" text-anchor="middle" font-size="12" font-weight="600" fill="#06b6d4">Tailwind</text>
