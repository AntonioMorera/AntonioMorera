<svg xmlns="http://www.w3.org/2000/svg" width="480" height="279" viewBox="0 0 480 279" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="acc-port" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d99b26"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
<clipPath id="clip"><rect x="1" y="1" width="478" height="277" rx="18"/></clipPath>
</defs>
<rect x="1" y="1" width="478" height="277" rx="18" fill="url(#bg)"/>
<g clip-path="url(#clip)">
<circle cx="430" cy="20" r="90" fill="#d99b26" filter="url(#blur)" opacity="0.32"><animate attributeName="opacity" values="0.22;0.42;0.22" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="30" cy="279" r="70" fill="#fbbf24" filter="url(#blur)" opacity="0.16"/>
<rect x="0" y="0" width="480" height="4" fill="url(#acc-port)"/>
</g>
<rect x="1" y="1" width="478" height="277" rx="18" fill="none" stroke="url(#acc-port)" stroke-opacity="0.55" stroke-width="1.5"/>

